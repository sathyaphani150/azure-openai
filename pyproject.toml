[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "azure-openai-it-helpdesk"
version = "0.1.0"
description = "AI-powered IT Helpdesk POC using Azure OpenAI, RAG, vision, and classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "openai>=1.75,<3",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
helpdesk-build-pdfs = "helpdesk.cli:build_pdfs_main"
helpdesk-ingest = "helpdesk.cli:ingest_main"

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.9,<2"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
